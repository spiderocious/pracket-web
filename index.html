    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Pracket",
      "url": "https://www.pracket.ng/",
      "description": "Browse verified tutors for every subject and level across Nigeria.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.pracket.ng/discover?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",

      "url": "https://www.pracket.ng/",

      "sameAs": []
    }
    </script>
  </head>
